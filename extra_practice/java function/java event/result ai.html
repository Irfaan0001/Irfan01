<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    .resultshow{
        margin: 2vw 50px 0px 25vw;
        border: 2px solid black;
        height: 50%;
        width: 50%;
        text-align: center;
        border-radius: 10px;
        padding: 20px;
    }

    input{
        width: 30%;
        border-radius: 5px;
        margin-top: 5px;
    }
    h2{
        margin: 25px 0px 30px 0px;
    }

    .btn {
        border: 2px solid blue;
        color: rgb(255, 255, 255);
        background: rgb(6, 109, 227);  
        border-radius: 5px;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }

    .error-message {
        color: red;
        font-size: 14px;
        margin-top: 10px;
        display: none;
    }

  </style>
</head>
<body>

  <div class="resultshow">
  <h2>Marks </h2>
  <form> 
   
	   English:<input type="number" id="english" placeholder="Enter English Marks" name="english" required min="0" max="100"> <br><br><br>
	   Hindi:<input type="number" id="hindi" placeholder="Enter hindi Marks" name="hindi" required min="0" max="100"><br><br><br>
	   Gujarati:<input type="number" id="gujarati" placeholder="Enter gujarati Marks" name="gujarati" required min="0" max="100"><br><br><br>
	   <button class="btn btn-primary" onclick="return result()">Submit</button>
   
  </form>
  
  <div id="errorMessage" class="error-message">
    Please fill out all your marks before submitting!
  </div>
  
		<h1 id="test1"></h1>
		<h1 id="test2"></h1>
		<h1 id="test3"></h1>
  </div>
  <script>
	function result(){
		
		var english = document.getElementById('english').value;
		var hindi = document.getElementById('hindi').value;
		var gujarati = document.getElementById('gujarati').value;
		var errorDiv = document.getElementById('errorMessage');
		
		var englishInput = document.getElementById('english');
		var hindiInput = document.getElementById('hindi');
		var gujaratiInput = document.getElementById('gujarati');
		
		var hasError = false;
		
		// Check English field
		if(english === '' || english === null) {
			englishInput.placeholder = "Fill out English marks!";
			englishInput.style.borderColor = "red";
			hasError = true;
		} else {
			englishInput.placeholder = "Enter English Marks";
			englishInput.style.borderColor = "";
		}
		
		// Check Hindi field
		if(hindi === '' || hindi === null) {
			hindiInput.placeholder = "Fill out Hindi marks!";
			hindiInput.style.borderColor = "red";
			hasError = true;
		} else {
			hindiInput.placeholder = "Enter Hindi Marks";
			hindiInput.style.borderColor = "";
		}
		
		// Check Gujarati field
		if(gujarati === '' || gujarati === null) {
			gujaratiInput.placeholder = "Fill out Gujarati marks!";
			gujaratiInput.style.borderColor = "red";
			hasError = true;
		} else {
			gujaratiInput.placeholder = "Enter Gujarati Marks";
			gujaratiInput.style.borderColor = "";
		}
		
		// If any field has error, show general error message and prevent submission
		if(hasError) {
			errorDiv.style.display = 'block';
			
			// Hide results
			document.getElementById('test1').innerHTML = '';
			document.getElementById('test2').innerHTML = '';
			document.getElementById('test3').innerHTML = '';
			
			// Prevent form submission
			return false;
		}
		
		// Hide error message if all fields are filled
		errorDiv.style.display = 'none';
		
		var total = +english + +hindi + +gujarati;
		
		document.getElementById('test1').innerHTML = "Total is : " + total;
		
		var per = (total * 100) / 300;
		document.getElementById('test2').innerHTML = "Per is : " + per + "%";
		
		if(per > 90) {
			document.getElementById('test3').innerHTML = "Grade is : O";
		}
		else if(per > 80) {
			document.getElementById('test3').innerHTML = "Grade is : A++";
		}
		else if(per > 70) {
			document.getElementById('test3').innerHTML = "Grade is : A";
		}
		else if(per > 60) {
			document.getElementById('test3').innerHTML = "Grade is : B";
		}
		else if(per > 50) {
			document.getElementById('test3').innerHTML = "Grade is : C";
		}
		else if(per > 40) {
			document.getElementById('test3').innerHTML = "Grade is : Pass";
		}
		else {
			document.getElementById('test3').innerHTML = "Grade is : Fail";
		}
		return false;
	}
  </script>  

</body>
</html>
