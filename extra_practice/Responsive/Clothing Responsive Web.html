<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>


*{
	box-sizing:border-box;
}

.row{
	display:flex;
	flex-wrap: wrap;
}

/*   default work on Mobile less 600 Resolution  */
[class*="col-"]{
	width:100%;
}

/*   class work on tablet >600 && <768 */
@media only screen and (min-width: 600px) {
	.col-s-1 {width: 8.33%;}
	.col-s-2 {width: 16.66%;}
	.col-s-3 {width: 25%;}
	.col-s-4 {width: 33.33%;}
	.col-s-5 {width: 41.66%;}
	.col-s-6 {width: 50%;}
	.col-s-7 {width: 58.33%;}
	.col-s-8 {width: 66.66%;}
	.col-s-9 {width: 75%;}
	.col-s-10 {width: 83.33%;}
	.col-s-11 {width: 91.66%;}
	.col-s-12 {width: 100%;}
}
/*   class work on Desktop >768 */
@media only screen and (min-width: 768px) {
	.col-1 {width: 8.33%;}
	.col-2 {width: 16.66%;}
	.col-3 {width: 25%;}
	.col-4 {width: 33.33%;}
	.col-5 {width: 41.66%;}
	.col-6 {width: 50%;}
	.col-7 {width: 58.33%;}
	.col-8 {width: 66.66%;}
	.col-9 {width: 75%;}
	.col-10 {width: 83.33%;}
	.col-11 {width: 91.66%;}
	.col-12 {width: 100%;}
}



.nav{
            height: 80px;
            background-color: aliceblue;
            display: flex;
            padding-left: 20px;
            padding-top: 18px;
        }

        .nav ul{
            display: flex;
            list-style-type: none;
            margin-left: 260px;
        }

        .nav ul li{
            padding: 15px;
            font-size: 20px;
            margin-right: 20px;
        }

        .nav a {
            text-decoration: none;
            color: black;
        }

        .nav a:hover {
            color:#E87A8B;
        }

        .nav button{
            height: 50px;
            width: 80px;
            margin-left: 430px;
            padding: 10px;
            color: white;
            background-color: #E87A8B;
            border-radius: 7px;
        }



</style>
</head>
<body>
	
	 <div class="col-12 nav">

            <h1>Tehzeebe <span style="color: #E87A8B;"> Noor </span></h1>

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <button>Login</button>
        </div>
	

	
</body>
</html>
