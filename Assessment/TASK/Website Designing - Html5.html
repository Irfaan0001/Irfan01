<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
   
    <style>
         * {
            margin: 10px 10px 10px 10px;
            padding: auto;
            box-sizing: border-box;
        }

        .row {
            display: flex;
        }

        .row1 {
            flex-wrap: nowrap;

        }

        .col-1 {
            width: 8.33%
        }

        .col-2 {
            width: 16.66%
        }

        .col-3 {
            width: 25%
        }

        .col-4 {
            width: 33.33%
        }

        .col-5 {
            width: 41.66%
        }

        .col-6 {
            width: 50%
        }

        .col-7 {
            width: 58.33%
        }

        .col-8 {
            width: 66.66%
        }

        .col-9 {
            width: 75%
        }

        .col-10 {
            width: 83.33%
        }

        .col-11 {
            width: 91.66%
        }

        .col-12 {
            width: 100%
        }

        body {
            background-color: rgb(139, 231, 251);
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .head {
            background-color: aliceblue;
            height: 100px;
            padding: 8px;
            width: 98.80%;
            display: flex;
            float: left;
        }

        .aa {

            margin-top: 10px;
        }

        .main {
            height: 500px;
            width: 100%;
            margin-top: 150px;
            margin-left: 0px;
            background-color: aliceblue;
        }

        .main input {
            height: 50px;
            width: 200px;
            margin-top: 30px;
            margin-left: 30px;
        }

        .main button {
            background-color: rgb(238, 23, 23);
            height: 40px;
            cursor: pointer;
            border-radius: 7px;
            width: 100px;
            margin-left: 50px;
        }

        .map {
            margin-top: -500px;
            margin-left: 550px;
        }
        .map a{
            border-radius: 5px;
        }
        /* Style all font awesome icons */
        .fa {
        padding: 18px;
        font-size: 18px;
        width: 50px;
        text-align: center;
        text-decoration: none;
        }

        /* Add a hover effect if you want */
        .fa:hover {
        opacity: 0.7;
        }

        /* Set a specific color for each brand */

        /* Facebook */
        .fa-facebook {
        background: #3B5998;
        color: white;
        }
        .fa-linkedin {
        background: #143d96;
        color: white;
        }

        /* Twitter */
        .fa-twitter {
        background: #55ACEE;
        color: white;
        }
        .fa-github {
        background: #000000;
        color: white;
        }
       
    </style>
</head>

<body>
    <h1>CONTACT US</h1>
    <HR>
    <div class="col-12 head">
        <p style="font-size: 15px;">ADDRESS:</p><br><br>
        <p style="margin-top: 35px;margin-left: -87px;">Saint Marco Street, 6th <br>
            Floor, Tokyo, Japan, 123456. </p>

        <div class="col-3 aa">
            <p style="color: red;margin-left: 50px;">&#9742; +91 1234567890</p>
            <p style="margin-left: 50px;color: rgb(16, 130, 124);">&#128386 example@gmail.com</p>

        </div>
    </div>

    <div class="row1">
        <div class="col-6 main">
            <form action="post">
            <input type="text" placeholder="Name:" name="n1" required pattern="[a-zA-Z]+" title="Add Alpha">
            <input type="text" placeholder="Company:" name="n1" required pattern="[a-zA-Z]+" title="Add Alpha">
            <br>
            <input type="email" placeholder="Email:" name="n1" required>
            <input type="tel" placeholder="Mobile:" name="n1" required>
            <br>
            <br>
            <textarea style="margin-left: 30px;height: 90px;width: 450px;" name="msg" placeholder="Message" id=""></textarea>
            <br>
            <button>Send</button>
            </form>
        </div>

        <div class="col-6 map">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7345.442270404033!2d72.60642777392937!3d22.99727987919153!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e85c2fc005927%3A0x918e69150ca1c935!2sTOPS%20Technologies!5e0!3m2!1sen!2sin!4v1750138612649!5m2!1sen!2sin"
                width="600" height="400" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
                <br>
                <a href="#" class="fa fa-facebook"></a>
                <a href="#" class="fa fa-twitter"></a>
                <a href="#" class="fa fa-linkedin"></a>
                <a href="#" class="fa fa-github"></a>

        </div>

    </div>
      
</body>

</html>
